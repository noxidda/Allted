<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allted Pro | Python File Conversion Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .panel-3d {
      background: #ffffff;
      border: 1px solid #e9d5ff;
      box-shadow: 0 10px 30px -5px rgba(124, 58, 237, 0.08);
    }
    .dark .panel-3d {
      background: #181326;
      border: 1px solid #2e2245;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      color: #ffffff;
      border: 1px solid #6d28d9;
      box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%);
    }
    .btn-secondary {
      background: #f3e8ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }
    .dark .btn-secondary {
      background: #231a38;
      color: #ddd6fe;
      border: 1px solid #3b2a57;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#F5F0FF] via-[#FAFAFF] to-[#F3E8FF] dark:from-[#0D0B14] dark:via-[#120E1F] dark:to-[#18122B] text-[#1E1035] dark:text-[#F3E8FF] min-h-screen flex flex-col font-sans transition-colors duration-200">

  {/* Header Navbar */}
  <header class="p-4 bg-white dark:bg-[#181326] border-b border-[#E9D5FF] dark:border-[#2E2245] flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-[#7C3AED] to-[#A855F7] p-0.5 flex items-center justify-center shadow-md">
        <span class="text-white font-bold text-lg">A</span>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-wide text-[#2E1065] dark:text-[#F3E8FF]">ALLTED PRO</h1>
        <p class="text-[10px] text-[#7C3AED] dark:text-[#C084FC] font-semibold tracking-wider">PYTHON CONVERSION ENGINE</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- YouTube Channel Link -->
      <a href="https://youtube.com/@addixonmuzic?si=KyQH-olzH9EIk8bl" target="_blank" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors shadow-sm">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>Addixon Muzic</span>
      </a>

      <!-- Theme Toggle -->
      <button id="themeToggle" class="p-2 rounded-lg bg-[#F3E8FF] dark:bg-[#2A1F45] text-[#7C3AED] dark:text-[#C084FC] border border-[#DDD6FE] dark:border-[#3B2A57]">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 p-4 max-w-5xl mx-auto w-full flex flex-col gap-4">
    <!-- Converter Workspace -->
    <div class="panel-3d rounded-2xl p-6 flex flex-col gap-4">
      <h2 class="text-xs font-bold text-[#6D28D9] dark:text-[#C084FC] uppercase tracking-wider">PYTHON CONVERT FILE</h2>

      <!-- File Drop Area -->
      <div id="dropZone" class="border-2 border-dashed border-[#C084FC] dark:border-[#3B2A57] bg-[#FAF5FF] dark:bg-[#110D1D] rounded-xl p-8 text-center cursor-pointer hover:border-[#7C3AED] transition-all">
        <input type="file" id="fileInput" class="hidden">
        <div class="w-12 h-12 rounded-xl bg-white dark:bg-[#181326] mx-auto mb-3 flex items-center justify-center shadow-md">
          <svg class="w-6 h-6 text-[#7C3AED] dark:text-[#C084FC]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
        </div>
        <h3 id="fileNameLabel" class="font-bold text-lg mb-1">Drop File Here or Click to Browse</h3>
        <p class="text-xs text-[#6B5B95] dark:text-[#A799CC]">Supports DOCX, PDF, PNG, JPG, MP4, MP3, STL, ZIP, CSV, JSON and more.</p>
      </div>

      <!-- Format Selector -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-[#6D28D9] dark:text-[#C084FC] uppercase">TARGET FORMAT</label>
        <div id="formatGrid" class="flex flex-wrap gap-2">
          <button data-fmt="pdf" class="fmt-btn btn-primary text-xs px-3 py-1.5 rounded-lg font-bold">PDF</button>
          <button data-fmt="docx" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">DOCX</button>
          <button data-fmt="png" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">PNG</button>
          <button data-fmt="jpg" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">JPG</button>
          <button data-fmt="mp3" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">MP3</button>
          <button data-fmt="mp4" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">MP4</button>
          <button data-fmt="stl" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">STL</button>
          <button data-fmt="zip" class="fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold">ZIP</button>
        </div>
      </div>

      <!-- Convert Action -->
      <button id="convertBtn" class="btn-primary text-xs py-3 px-6 rounded-xl font-bold uppercase tracking-wider w-full shadow-lg">
        CONVERT NOW
      </button>

      <!-- Status Indicator -->
      <div id="statusBox" class="hidden p-4 rounded-xl bg-[#FAF5FF] dark:bg-[#110D1D] text-xs font-bold text-center"></div>
    </div>
  </main>

  <script>
    let selectedFile = null;
    let selectedTarget = 'pdf';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameLabel = document.getElementById('fileNameLabel');
    const convertBtn = document.getElementById('convertBtn');
    const statusBox = document.getElementById('statusBox');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      if (e.target.files.length) {
        selectedFile = e.target.files[0];
        fileNameLabel.innerText = selectedFile.name + " (" + (selectedFile.size/1024).toFixed(1) + " KB)";
      }
    };

    dropZone.ondragover = (e) => { e.preventDefault(); };
    dropZone.ondrop = (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) {
        selectedFile = e.dataTransfer.files[0];
        fileNameLabel.innerText = selectedFile.name + " (" + (selectedFile.size/1024).toFixed(1) + " KB)";
      }
    };

    document.querySelectorAll('.fmt-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.fmt-btn').forEach(b => {
          b.className = "fmt-btn btn-secondary text-xs px-3 py-1.5 rounded-lg font-bold";
        });
        btn.className = "fmt-btn btn-primary text-xs px-3 py-1.5 rounded-lg font-bold";
        selectedTarget = btn.dataset.fmt;
      };
    });

    convertBtn.onclick = async () => {
      if (!selectedFile) {
        alert("Please select a file first!");
        return;
      }

      statusBox.classList.remove('hidden');
      statusBox.innerText = "Converting file with Python engine...";

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('target', selectedTarget);

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error("Conversion failed");

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) + "." + selectedTarget;
        a.click();

        statusBox.innerText = "✔ Conversion Complete! Download triggered.";
      } catch (err) {
        statusBox.innerText = "❌ Error: " + err.message;
      }
    };

    // Dark Mode Toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    let isDark = localStorage.getItem('allted_theme_mode') === 'dark';

    function updateTheme() {
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.innerText = "☀️";
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.innerText = "🌙";
      }
    }
    updateTheme();

    themeToggle.onclick = () => {
      isDark = !isDark;
      localStorage.setItem('allted_theme_mode', isDark ? 'dark' : 'light');
      updateTheme();
    };
  </script>
</body>
</html>
